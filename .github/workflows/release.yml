name: Release

# Tag-triggered releases: push an annotated tag `vX.Y.Z` and this creates
# the GitHub Release with notes extracted from that version's CHANGELOG
# section. The Zenodo GitHub integration then archives the release and
# mints the versioned DOI from .zenodo.json — publishing a release IS the
# archival step, so tags only get pushed when CHANGELOG, pyproject,
# CITATION.cff, and codemeta.json already agree on the version.
#
# PyPI drifted to 0.3.0 while the repository shipped 1.2.0 because publishing
# was a manual step somebody had to remember, run from a laptop holding a
# token. The `publish` job below removes both failure modes: the tag is the
# trigger, and OIDC trusted publishing means no token exists to expire, leak,
# or be forgotten. One-time setup is documented on that job.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches the release manifest
        # The manifest is the source of truth; pyproject is one of the surfaces
        # it governs. Checking the tag against the manifest and then running
        # the full surface check means a tag cannot ship while README, CITATION,
        # codemeta, SECURITY, or a model card still disagree.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c 'import json;print(json.load(open("release-manifest.json"))["version"])')
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG does not match release-manifest.json version $MANIFEST"
            exit 1
          fi

      - name: Release truth (strict — out-of-repo surfaces must be resolved)
        # --strict-manual is the difference between CI and a release: PyPI and
        # the Hugging Face cards are advisory notes on every PR, but a tag that
        # ships while a model card still advertises a retracted metric is the
        # exact failure this gate exists to stop.
        run: |
          pip install --quiet pyyaml
          python scripts/ops/check_release_truth.py --strict-manual

      - name: Extract this version's CHANGELOG section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::no CHANGELOG section found for $TAG"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "openetruscan $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md

  publish:
    # Publish to PyPI only after `release` has passed the manifest check, so a
    # tag whose surfaces disagree never reaches the index. PyPI is the one
    # surface here that is genuinely irreversible — a version number cannot be
    # reused or replaced, only yanked — which is why it runs last and behind
    # every gate.
    #
    # ONE-TIME SETUP (no secret is ever stored):
    #   1. pypi.org -> openetruscan -> Manage -> Publishing -> Add a new publisher
    #        Owner:        Eddy1919
    #        Repository:   openEtruscan
    #        Workflow:     release.yml
    #        Environment:  pypi
    #   2. GitHub -> Settings -> Environments -> New environment named `pypi`.
    #      Add required reviewers there if you want a human approval step
    #      between the tag and the upload.
    # After that, `git tag v1.2.0 && git push --tags` publishes. If step 1 is
    # skipped this job fails with an OIDC error and the GitHub Release still
    # succeeds — the release is not held hostage to the setup.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Job-level `permissions` REPLACES the workflow default rather than
      # merging with it, so both scopes must be listed. `contents: read` is
      # what actions/checkout needs; write is deliberately withheld, since
      # this job must never be able to push to the repository.
      contents: read
      # Mints the short-lived OIDC token PyPI exchanges for an upload token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install --quiet build
          python -m build

      - name: Verify the built version matches the tag
        # `python -m build` reads pyproject, which `release` already checked
        # against the manifest — but the artifact filename is what PyPI
        # actually indexes, and an unexpected name here means something
        # rewrote the version during the build.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/openetruscan-$TAG.tar.gz" ]; then
            echo "::error::expected dist/openetruscan-$TAG.tar.gz; got: $(ls dist)"
            exit 1
          fi

      - name: Check artifact metadata
        run: |
          pip install --quiet twine
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
