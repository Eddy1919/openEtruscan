version: 2
updates:
  # The root package is managed with uv: the uv ecosystem bumps pyproject.toml
  # and uv.lock together, so `uv sync --locked` in CI keeps passing. (The pip
  # ecosystem edited pyproject.toml alone and left the lockfile stale.)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The Cloud Run services pin their own plain requirements.txt files.
  - package-ecosystem: "pip"
    directories:
      - "/services/byt5-restorer"
      - "/services/minilm-reranker"
    schedule:
      interval: "weekly"
    groups:
      service-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-dependencies:
        patterns:
          - "*"
