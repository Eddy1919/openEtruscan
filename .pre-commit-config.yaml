# Pre-commit hooks for OpenEtruscan
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
        language_version: python3

  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Run the linter (all tracked Python; per-file-ignores live in pyproject.toml)
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Mypy - Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^src/openetruscan/
        additional_dependencies: [types-PyYAML, types-requests]

  # Lockfile freshness — the gate that was missing on 2026-08-08
  - repo: local
    hooks:
      - id: uv-lock-check
        # The 1.3.0 release bumped `version` and the ruff pin in pyproject.toml
        # without relocking. Every documented gate passed locally, and CI still
        # went red — `uv sync --locked` in the `openapi-drift` job refused a
        # lockfile recording both old values. AGENTS.md rule 4 now requires
        # `uv lock --check` when pyproject.toml is touched, but a rule nothing
        # runs is a rule that gets skipped, which is how it was skipped once.
        # This moves the check to commit time, where the fix is one command
        # away, instead of after push inside a job whose name says "openapi".
        #
        # `local` + `language: system` on purpose: a third-party hook repo
        # would be a new dependency (an AGENTS.md escalation trigger), and uv
        # is already required by CONTRIBUTING.md's gate list.
        name: uv lock --check (lockfile agrees with pyproject.toml)
        entry: uv lock --check
        language: system
        # Only when the two files that can disagree are actually staged.
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
